{% extends "base.html" %}

{% block title %}Access Denied (403){% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 text-center">
        <div class="card card-custom p-5">
            <div class="text-danger mb-3">
                <i class="bi bi-shield-slash fs-1"></i>
            </div>
            <h2 class="fw-bold text-dark mb-2">Access Denied</h2>
            <p class="text-muted mb-4">You do not have permission to view or access this resource.</p>
            <div>
                <a href="{{ url_for('dashboard') }}" class="btn btn-primary px-4 py-2">
                    <i class="bi bi-arrow-left me-1"></i> Return to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
